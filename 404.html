<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
/* a flying saucer swoops in from the top-left corner, beams the cow up, and flies off;
   once it's gone, the visitor is sent to the homepage (embedded in the Play bento, it loops instead) */
(function () {
  var embed = document.documentElement.className === 'embed';
  function home() { window.location.replace('/'); }
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!window.gsap || reduceMotion) {                     // no animation: show the scene, then go home
    if (window.gsap) gsap.set('.beam', { opacity: 1 });
    if (!embed) setTimeout(home, 4000);
    return;
  }
  var ufo = document.querySelector('.ufo'), cow = document.querySelector('.cow'), beam = document.querySelector('.beam');
  var r = ufo.getBoundingClientRect();
  var fromX = -(r.left + r.width + 40), fromY = -(r.top + r.height + 40);           // just off the top-left corner
  var toX = window.innerWidth - r.left + 40, toY = -(r.top + r.height + 120);       // off the top-right
  var lift = cow.getBoundingClientRect().top - r.bottom + 8;                         // cow rises into the saucer

  gsap.set(ufo, { x: fromX, y: fromY, rotation: 14 });
  gsap.timeline(embed ? { delay: 0.6, repeat: -1, repeatDelay: 1.2 } : { delay: 0.6, onComplete: home })
    // swoop down from the corner and settle over the cow
    .to(ufo, { x: 0, duration: 2.2, ease: 'power1.out' })
    .to(ufo, { y: 0, duration: 2.2, ease: 'power3.out' }, '<')
    .to(ufo, { rotation: 0, duration: 2.2, ease: 'power2.out' }, '<')
    .to(ufo, { y: -6, duration: 0.35, ease: 'sine.inOut', yoyo: true, repeat: 1 })
    // tractor beam on, cow floats up wiggling and shrinks into the saucer
    .fromTo(beam, { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.4, ease: 'power2.out' })
    .to(cow, { y: -lift, scale: 0.55, duration: 1.8, ease: 'power1.inOut' }, '+=0.15')
    .to(cow, { rotation: 8, duration: 0.18, ease: 'sine.inOut', yoyo: true, repeat: 9 }, '<')
    .to(cow, { opacity: 0, duration: 0.15 }, '-=0.15')
    .to(beam, { opacity: 0, scaleY: 0, duration: 0.3, ease: 'power2.in' })
    // a little hop, then off the top-right of the page
    .to(ufo, { y: -12, duration: 0.25, ease: 'power2.out' })
    .to(ufo, { x: toX, y: toY, rotation: -12, duration: 1.0, ease: 'power2.in' });
})();
</script>
