<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gallery (draft) — Amelia's Portfolio</title>
<!-- Draft page: listed in .vercelignore so it never deploys. Preview at /gallery-draft.html -->
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=101">
<link rel="stylesheet" href="scratch-card.css?v=2">
<style>
  /* ---- Gallery bento ---- */
  .draft-tag {
    display: inline-block; margin-left: 10px; vertical-align: middle;
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); border: 1px dashed var(--muted); border-radius: 999px; padding: 3px 9px;
  }

  .bento {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 150px;
    gap: 16px;
    max-width: 1100px;
  }
  .tile {
    position: relative; overflow: hidden; border-radius: 18px;
    background: #ebe9e3; color: #fff; text-decoration: none;
  }
  .tile img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .6s cubic-bezier(.2,.7,.2,1);
  }
  a.tile:hover img, .tile:not(.scratch-card):hover img { transform: scale(1.03); }

  /* caption sits bottom-left over a soft fade, like the scratch card's label */
  .tile-cap {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; pointer-events: none;
    padding: 48px 22px 18px;
    background: linear-gradient(to top, rgba(0,0,0,.5), rgba(0,0,0,0));
  }
  .tile-cap h3 { font-size: clamp(16px, 1.6vw, 20px); font-weight: 500; letter-spacing: -.01em; }
  .tile-cap p { margin-top: 2px; font-size: 13px; color: rgba(255,255,255,.72); line-height: 1.4; }
  .tile-arrow {
    position: absolute; top: 14px; right: 14px; z-index: 2;
    display: grid; place-items: center; width: 34px; height: 34px; border-radius: 999px;
    background: rgba(255,255,255,.92); color: #161616; font-size: 15px;
    transition: transform .3s ease;
  }
  a.tile:hover .tile-arrow { transform: translate(2px, -2px); }
  a.tile:focus-visible { outline: 2px solid var(--cursor); outline-offset: 3px; }

  /* placement */
  .t-scratch { grid-column: 1 / 3; grid-row: 1 / 3; }
  .t-frida   { grid-column: 3;     grid-row: 1 / 5; }
  .t-froyo   { grid-column: 1;     grid-row: 3 / 5; }
  .t-paros   { grid-column: 2;     grid-row: 3 / 5; }

  /* the scratch card fills its cell instead of using its own 16:7 ratio */
  .bento .scratch-card { aspect-ratio: auto; height: 100%; }

  @media (max-width: 1100px) {
    .bento { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 130px; }
    .t-scratch { grid-column: 1 / 3; grid-row: 1 / 3; }
    .t-frida   { grid-column: 1;     grid-row: 3 / 7; }
    .t-froyo   { grid-column: 2;     grid-row: 3 / 5; }
    .t-paros   { grid-column: 2;     grid-row: 5 / 7; }
  }
  @media (max-width: 760px) {
    main { margin-left: 0; padding: 32px 16px 12vh; }
    /* the live site turns the sidebar into a slide-in drawer here; the draft just stacks it */
    .sidebar { position: static; transform: none; width: auto; height: auto; border-right: none; border-bottom: 1px solid rgba(30,40,60,.13); padding: 18px 16px 24px; }
    .bento { grid-template-columns: 1fr; grid-auto-rows: auto; }
    .bento > * { grid-column: auto !important; grid-row: auto !important; }
    .bento .t-scratch { aspect-ratio: 4 / 3; height: auto; }
    .t-frida   { aspect-ratio: 3 / 4; }
    .t-froyo, .t-paros { aspect-ratio: 16 / 10; }
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <div>
      <div class="wordmark">Amelia Simpson <span class="draft-tag">draft</span></div>
    </div>

    <div class="nav-group">
      <div class="group-label">Index</div>
      <nav class="side-nav">
        <a href="/work">Work</a>
        <a class="active" href="gallery-draft.html">Gallery</a>
        <a href="/about">About</a>
      </nav>
    </div>

    <hr class="divider">
  </aside>

  <main>
    <section class="bento" aria-label="Gallery">
      <!-- Scratch art (interactive) -->
      <div class="tile t-scratch scratch-card" data-scratch-card role="img"
           aria-label="Interactive scratch-art card: drag to scratch through black wax and reveal a rainbow foil underneath">
        <div class="scratch-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 20 L7 13 L17 3 L21 7 L11 17 Z" /><path d="M7 13 L11 17" />
          </svg>
          scratch me!
        </div>
        <div class="scratch-label">
          <h3>Scratch Art</h3>
          <p>Personal Project · Fall 2026</p>
        </div>
        <div class="scratch-actions">
          <button type="button" data-scratch-save aria-label="Save your drawing">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" /></svg>
          </button>
          <button type="button" data-scratch-reset aria-label="Start over with a fresh black page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" /></svg>
          </button>
        </div>
      </div>

      <figure class="tile t-frida">
        <img src="images/playground/frida-litho.jpg" alt="A pencil lithograph of Frida Kahlo surrounded by flowers, drawn on a litho plate">
        <figcaption class="tile-cap">
          <h3>Frida Litho</h3>
          <p>A lithograph I made for my printmaking class</p>
        </figcaption>
      </figure>

      <a class="tile t-froyo" href="https://froyo-shop.vercel.app/" target="_blank" rel="noopener">
        <img src="images/playground/froyo-shop.jpg" alt="The Froyo Shop app: a soft-serve frozen yogurt in a polka-dot cup with flavor, cup, and topping pickers">
        <span class="tile-arrow" aria-hidden="true">↗</span>
        <div class="tile-cap">
          <h3>The Froyo Shop</h3>
          <p>Build and share your own frozen treat</p>
        </div>
      </a>

      <figure class="tile t-paros">
        <img src="images/playground/paros.jpg" alt="A white Greek church with a blue dome and bell tower at golden hour, on the island of Paros">
        <figcaption class="tile-cap">
          <h3>Paros, Greece</h3>
          <p>A church I photographed on the island</p>
        </figcaption>
      </figure>

    </section>
  </main>

  <script src="scratch-card.js?v=3"></script>
</body>
</html>
